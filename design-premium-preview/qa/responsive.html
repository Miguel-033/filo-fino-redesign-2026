<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Filo Fino · Revisión responsive</title><style>
*{box-sizing:border-box}body{margin:0;background:#111719;color:#f0efe8;font:16px/1.5 system-ui}header{padding:20px 24px;position:sticky;top:0;background:#182024;z-index:1;border-bottom:1px solid #455157}h1{font-size:22px;margin:0 0 12px}label{margin-right:12px}select{font:inherit;padding:10px;background:#f0efe8;color:#182024;max-width:100%}main{display:flex;align-items:start;gap:24px;padding:24px;width:max-content}figure{margin:0}figcaption{margin-bottom:12px;color:#e8be82}iframe{display:block;border:1px solid #455157;height:1150px;background:#182024}p{font-size:14px;margin-bottom:0;color:#a9bbc3}
</style></head><body><header><h1>Filo Fino · Revisión responsive</h1><label for="page">Página</label><select id="page"><option value="servicios/afilado-cuchillos-hosteleria-valencia/">Hostelería · nuevo Hero</option><option value="">Inicio</option><option value="servicios/">Servicios</option><option value="servicios/afilado-cuchillos-valencia/">Cuchillos</option><option value="servicios/afilar-tijeras-peluqueria-valencia/">Tijeras</option><option value="servicios/herramientas-manicura-pedicura-valencia/">Manicura</option><option value="servicios/afilado-cuchillas-maquinas-valencia/">Cuchillas</option></select><p>Ventanas CSS en Chrome de escritorio; no sustituye una prueba en iOS Safari o Android. Desplaza horizontalmente para ver las otras anchuras.</p></header><main id="frames"></main><script>
const frames=document.querySelector('#frames');const page=document.querySelector('#page');
for(const width of [320,375,390,430,768,1440]){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=width+' px';const frame=document.createElement('iframe');frame.width=width;frame.title='Vista de '+width+' px';frame.name='viewport-'+width;figure.append(caption,frame);frames.append(figure);}
function update(){for(const frame of document.querySelectorAll('iframe'))frame.src='../'+page.value;}
page.addEventListener('change',update);update();
</script></body></html>
