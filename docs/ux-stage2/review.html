<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Filo Fino · Revisión etapa 2</title><style>*{box-sizing:border-box}body{margin:0;background:#111719;color:#f0efe8;font:14px/1.5 system-ui}header{padding:12px 20px;background:#182024;border-bottom:1px solid #455157;display:flex;gap:16px;align-items:center}select{font:inherit;padding:6px}main{padding:16px 20px;width:max-content}iframe{display:block;box-sizing:content-box;border:0;background:#182024}</style></head><body><header><label>Anchura CSS <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select></label><label>Sección <select id="section"><option value="servicios">Tarjetas</option><option value="trabajos">Envíos</option></select></label><label>Altura <select id="height"><option>844</option><option>1000</option><option selected>1400</option></select></label><span>Preview real · Chrome de escritorio</span></header><main><iframe title="Revisión Filo Fino" id="review"></iframe></main><script>
const frame=document.querySelector('iframe'),width=document.querySelector('#width'),section=document.querySelector('#section'),height=document.querySelector('#height');
const p=new URLSearchParams(location.search);for(const el of [width,section,height])if([...el.options].some(o=>o.value===p.get(el.id)))el.value=p.get(el.id);
function load(){frame.width=width.value;frame.height=height.value;frame.src='../?stage2=review&revision='+encodeURIComponent(p.get('revision')||'2')+'#'+section.value;}
frame.addEventListener('load',()=>{const w=frame.contentWindow;w.document.fonts.ready.then(()=>{const el=w.document.getElementById(section.value),h=w.document.querySelector('.site-header').getBoundingClientRect().height;w.scrollTo({top:el.offsetTop-h-16,behavior:'instant'});});});
for(const el of [width,section,height])el.addEventListener('change',load);load();
</script></body></html>
